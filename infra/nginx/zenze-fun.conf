# /etc/nginx/sites-available/zenze.fun
# Cloudflare SSL/TLS: Full. App is TanStack Start on 127.0.0.1:3000.

limit_req_zone $binary_remote_addr zone=zenze_login:10m rate=8r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream zenze_node {
    server 127.0.0.1:3010;
    keepalive 16;
}

# Only Cloudflare edges (and this machine) may open the vhost.
# $realip_remote_addr is the connecting proxy, after real_ip rewrites the visitor.
geo $realip_remote_addr $cf_edge {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name zenze.fun www.zenze.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://zenze.fun$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zenze.fun;

    ssl_certificate /etc/ssl/certs/zenze.crt;
    ssl_certificate_key /etc/ssl/private/zenze.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    include /etc/nginx/snippets/zenze-edge.conf;
    return 301 https://zenze.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zenze.fun zenzen.fun;

    ssl_certificate /etc/ssl/certs/zenze.crt;
    ssl_certificate_key /etc/ssl/private/zenze.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 12m;

    include /etc/nginx/snippets/zenze-edge.conf;

    # Never intercept app 404s — the React page is the branded 404.
    # Named location cannot recurse into itself, so this cannot collapse
    # to the default "nginx/1.24.0 (Ubuntu)" page.
    proxy_intercept_errors off;
    error_page 404 =404 @zenze_404;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    open_file_cache max=4000 inactive=2m;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location @zenze_404 {
        internal;
        proxy_intercept_errors off;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /login {
        limit_req zone=zenze_login burst=5 nodelay;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header X-Frame-Options "DENY" always;
        proxy_intercept_errors off;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /admin {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header X-Frame-Options "DENY" always;
        proxy_intercept_errors off;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header X-Frame-Options "DENY" always;
        proxy_intercept_errors off;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        alias /var/www/zenze/sitemap.xml;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header X-Robots-Tag "noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /tokenlist.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=120, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        alias /var/www/zenze/tokenlist.json;
    }

    location = /znzf-token.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=120, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        alias /var/www/zenze/znzf.json;
    }

    location = /og.jpg {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /znzf-og.jpg {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~* ^/(favicon\.svg|favicon-32\.png|favicon-48\.png|apple-touch-icon\.png|icon-192\.png|icon-512\.png|manifest\.webmanifest|404\.html)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /brand/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /quotes/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /wallets/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /cards/ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Desk is public to browsers. Crawlers are 404'd by the app (branded page),
    # never by nginx `return 404` — that was collapsing to the Ubuntu default page.
    location ^~ /arise {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        proxy_intercept_errors off;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Hashed Vite chunks. Served from the accumulated static pool so a deploy
    # never 404s an old tab. Missing hashes return plain 404 — never HTML.
    # App dir is 711 so www-data can traverse only into this pool, not .env.
    location ^~ /assets/ {
        root /opt/zenze-fun/static;
        access_log off;
        gzip_static off;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri @asset_404;
    }

    location @asset_404 {
        internal;
        types { }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404 "Not found\n";
    }

    location / {
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        proxy_hide_header Cache-Control;
        proxy_intercept_errors off;
        proxy_pass http://zenze_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /__grok/ { deny all; }
    location ~ /\.git { deny all; }
    location ~ /\.env { deny all; }
    location ~ \.sql$ { deny all; }
    location ~ \.(md|sh)$ { deny all; }
}

server {
    listen 80;
    listen [::]:80;
    server_name zenzen.fun www.zenzen.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://zenzen.fun$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zenzen.fun;

    ssl_certificate /etc/ssl/certs/zenze.crt;
    ssl_certificate_key /etc/ssl/private/zenze.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    include /etc/nginx/snippets/zenze-edge.conf;
    return 301 https://zenzen.fun$request_uri;
}
